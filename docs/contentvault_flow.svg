<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">ContentVault URL 到 Obsidian 二创报告流程图</title>
  <desc id="desc">展示从拿到内容 URL、归档下载、生成 Codex 分析包、生成二创报告到同步 Obsidian 的流程，并标记需要手工操作的步骤。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .node { filter: url(#shadow); }
      .box { stroke-width: 2; rx: 18; ry: 18; }
      .manual { fill: #fff7db; stroke: #d97706; }
      .auto { fill: #eaf6ef; stroke: #16a34a; }
      .codex { fill: #e8f1ff; stroke: #2563eb; }
      .decision { fill: #f5f3ff; stroke: #7c3aed; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #111827; }
      .small { font: 400 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .tag { font: 700 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .tag-manual { fill: #92400e; }
      .tag-auto { fill: #166534; }
      .tag-codex { fill: #1d4ed8; }
      .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .line-label { font: 700 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
      .legend-title { font: 700 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1500"/>
  <g transform="translate(260 0)">
  <text class="title" x="640" y="70" text-anchor="middle">ContentVault: URL 到 Obsidian 二创报告流程</text>
  <text class="subtitle" x="640" y="108" text-anchor="middle">黄色为你需要手工操作，绿色为脚本自动完成，蓝色为 Codex 分析产出。</text>

  <g class="node">
    <rect class="box manual" x="110" y="160" width="300" height="108"/>
    <text class="tag tag-manual" x="132" y="190">手工</text>
    <text class="label" x="260" y="222" text-anchor="middle">拿到内容 URL</text>
    <text class="small" x="260" y="250" text-anchor="middle">抖音 / 头条 / 小红书</text>
  </g>

  <g class="node">
    <rect class="box manual" x="490" y="160" width="300" height="108"/>
    <text class="tag tag-manual" x="512" y="190">手工</text>
    <text class="label" x="640" y="218" text-anchor="middle">执行 add 命令</text>
    <text class="small" x="640" y="248" text-anchor="middle">归档链接和基础信息</text>
  </g>

  <g class="node">
    <rect class="box auto" x="870" y="160" width="300" height="108"/>
    <text class="tag tag-auto" x="892" y="190">脚本自动</text>
    <text class="label" x="1020" y="214" text-anchor="middle">生成基础文件</text>
    <text class="small" x="1020" y="244" text-anchor="middle">meta / content / summary</text>
  </g>

  <path class="line" d="M410 214 H490"/>
  <path class="line" d="M790 214 H870"/>

  <g class="node">
    <path class="decision" d="M640 340 L800 440 L640 540 L480 440 Z" stroke-width="2"/>
    <text class="label" x="640" y="430" text-anchor="middle">是否需要下载</text>
    <text class="label" x="640" y="460" text-anchor="middle">视频素材?</text>
  </g>

  <path class="line" d="M1020 268 V310 H640 V340"/>

  <g class="node">
    <rect class="box manual" x="120" y="610" width="320" height="118"/>
    <text class="tag tag-manual" x="142" y="640">手工 / 半自动</text>
    <text class="label" x="280" y="670" text-anchor="middle">下载或导入视频</text>
    <text class="small" x="280" y="700" text-anchor="middle">Downie / yt-dlp / cookies</text>
  </g>

  <g class="node">
    <rect class="box auto" x="500" y="610" width="280" height="118"/>
    <text class="tag tag-auto" x="522" y="640">脚本自动</text>
    <text class="label" x="640" y="670" text-anchor="middle">视频进入 media/</text>
    <text class="small" x="640" y="700" text-anchor="middle">保存到素材目录</text>
  </g>

  <g class="node">
    <rect class="box auto" x="840" y="610" width="320" height="118"/>
    <text class="tag tag-auto" x="862" y="640">脚本自动</text>
    <text class="label" x="1000" y="670" text-anchor="middle">抽取关键帧</text>
    <text class="small" x="1000" y="700" text-anchor="middle">analysis/frames/</text>
  </g>

  <path class="line" d="M552 495 H280 V610"/>
  <text class="line-label" x="400" y="520" text-anchor="middle">是</text>
  <path class="line" d="M440 669 H500"/>
  <path class="line" d="M780 669 H840"/>

  <g class="node">
    <rect class="box auto" x="120" y="820" width="320" height="118"/>
    <text class="tag tag-auto" x="142" y="850">脚本自动</text>
    <text class="label" x="280" y="880" text-anchor="middle">仅网页正文/链接</text>
    <text class="small" x="280" y="910" text-anchor="middle">无视频时走这条路</text>
  </g>

  <path class="line" d="M640 540 V792 H280 V820"/>
  <text class="line-label" x="666" y="650">否</text>

  <g class="node">
    <rect class="box auto" x="480" y="820" width="320" height="118"/>
    <text class="tag tag-auto" x="502" y="850">脚本自动</text>
    <text class="label" x="640" y="880" text-anchor="middle">生成 Codex 分析包</text>
    <text class="small" x="640" y="910" text-anchor="middle">analysis/codex_brief.md</text>
  </g>

  <path class="line" d="M1000 728 V790 H640 V820"/>
  <path class="line" d="M440 879 H480"/>

  <g class="node">
    <rect class="box manual" x="120" y="1030" width="320" height="118"/>
    <text class="tag tag-manual" x="142" y="1060">手工触发</text>
    <text class="label" x="280" y="1090" text-anchor="middle">让 Codex 开始分析</text>
    <text class="small" x="280" y="1120" text-anchor="middle">读取 brief / 抽帧 / 正文</text>
  </g>

  <g class="node">
    <rect class="box codex" x="500" y="1030" width="280" height="118"/>
    <text class="tag tag-codex" x="522" y="1060">Codex</text>
    <text class="label" x="640" y="1090" text-anchor="middle">生成二创报告</text>
    <text class="small" x="640" y="1120" text-anchor="middle">analysis/creator_report.md</text>
  </g>

  <g class="node">
    <rect class="box manual" x="840" y="1030" width="320" height="118"/>
    <text class="tag tag-manual" x="862" y="1060">手工</text>
    <text class="label" x="1000" y="1090" text-anchor="middle">执行 export-obsidian</text>
    <text class="small" x="1000" y="1120" text-anchor="middle">更新已有 Obsidian 笔记</text>
  </g>

  <path class="line" d="M640 938 V985 H280 V1030"/>
  <path class="line" d="M440 1089 H500"/>
  <path class="line" d="M780 1089 H840"/>

  <g class="node">
    <rect class="box auto" x="400" y="1240" width="480" height="128"/>
    <text class="tag tag-auto" x="422" y="1270">结果</text>
    <text class="label" x="640" y="1300" text-anchor="middle">Obsidian 笔记可直接阅读</text>
    <text class="small" x="640" y="1330" text-anchor="middle">写入 “## 二创报告”</text>
  </g>

  <path class="line" d="M1000 1148 V1200 H640 V1240"/>

  <g>
    <rect x="110" y="1410" width="1060" height="54" rx="14" ry="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="legend-title" x="140" y="1444">当前最少 3 个动作:</text>
    <text class="small" x="310" y="1444">1. add 归档下载</text>
    <text class="small" x="500" y="1444">2. 让 Codex 生成 creator_report</text>
    <text class="small" x="790" y="1444">3. export-obsidian 更新笔记</text>
  </g>
  </g>
</svg>
